<section class="cart-page">

    <h1>Your Shopping Cart</h1>
  
    <div *ngIf="cartItems.length > 0; else emptyCart">
  
      <div
        class="cart-item"
        *ngFor="let painting of cartItems; let i = index"
      >
  
        <img
          [src]="painting.image"
          [alt]="painting.title"
        >
  
        <div class="cart-item-details">
          <h3>{{ painting.title }}</h3>
  
          <p>{{ painting.category }}</p>
  
          <p>₹{{ painting.price }}</p>
        </div>
  
        <button
          type="button"
          (click)="removeItem(i)"
        >
          Remove
        </button>
  
      </div>
  
      <div class="cart-total">
        <h2>Total: ₹{{ total }}</h2>
        <div *ngIf="cartItems.length > 0">

            <a routerLink="/checkout" class="checkout-button">
              Proceed to Checkout
            </a>
          
          </div>
        <button
          type="button"
          (click)="clearCart()"
        >
          Clear Cart
        </button>
      </div>
  
    </div>
  
    <ng-template #emptyCart>
      <p>Your cart is empty.</p>
  
      <a routerLink="/paintings">
        Explore Paintings
      </a>
    </ng-template>
  
  </section>
